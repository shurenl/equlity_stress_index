name: Daily ESI Report

on:
  workflow_dispatch:
  schedule:
    # 08:30 Asia/Shanghai every day.
    - cron: "30 0 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          required = ["FRED_API_KEY", "GMAIL_USERNAME", "GMAIL_APP_PASSWORD"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub repository secret(s): " + ", ".join(missing))
          print("Required secrets are configured")
          PY

      - name: Run daily ESI pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_daily.py

      - name: Prepare long-history SPX target for diagnostics
        run: python scripts/update_local_gspc.py

      - name: Run diagnostics report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.diagnostics.run_diagnostics

      - name: Send PDF reports by Gmail
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python -m src.email_report --include-diagnostics

      - name: Upload PDF reports
        uses: actions/upload-artifact@v6
        with:
          name: esi-pdf-reports
          path: |
            reports/*.pdf
            reports/diagnostics/*.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload processed evaluation tables
        uses: actions/upload-artifact@v6
        with:
          name: esi-evaluation-tables
          path: data/processed/evaluation/*.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Upload diagnostics tables
        uses: actions/upload-artifact@v6
        with:
          name: esi-diagnostics-tables
          path: data/diagnostics/*.parquet
          if-no-files-found: warn
          retention-days: 30
